name: medinvoiceai
description: "PharmaBill - Medicine Billing Calculator App"

publish_to: 'none'

version: 1.0.2+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  image_picker: ^1.1.2
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.2.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_mobile_ads: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/medicines_list.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"